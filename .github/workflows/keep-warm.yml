# Pings the Render backend so its free instance doesn't fall asleep
# (Render sleeps it after 15 idle minutes, and the next visitor waits
# ~50s). One always-on free service uses ~744 of Render's 750 free
# instance-hours a month, so this stays within the free tier.
# GitHub may delay scheduled runs a few minutes; every 10 min leaves room.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 --retry 2 https://scholarship-app-cyrs.onrender.com/api/health
