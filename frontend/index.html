<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale/user-scalable lock: blocking pinch-zoom fails
         WCAG 1.4.4 for low-vision users. The swipe card sets
         touch-action itself, so gestures still don't fight the browser. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1B3A" />
    <title>ScholarMatch</title>
    <meta
      name="description"
      content="ScholarMatch: swipe through scholarships matched to your profile. Free, no ads, no tracking."
    />
    <!-- The one display face (Libre Franklin) is self-hosted via
         @fontsource, imported in src/main.jsx. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
